# Completion-only reasoning on SVAMP: vanilla LoRA vs. response-position PivotLoRA.
# Reproduces: results/reasoning.csv (svamp rows), results/pivot_diagnostics.csv
# Paper: Section "Generated-Answer Mathematical Reasoning",
#        Appendix "Generated-Answer Reasoning Details"
# Entry point: python src/train_reasoning_svamp.py
#
# This protocol deliberately reuses the frozen GSM8K protocol unchanged for
# tokenization, masking, PCA source, pivot, optimizer-state reset, and
# generation. Only the dataset-specific formatting differs.

experiment: svamp_response_pca_qr_matched_v1
source_protocol: gsm8k_response_pca_qr_matched_v1
script: src/train_reasoning_svamp.py

model:
  checkpoint: meta-llama/Llama-3.1-8B
  base_precision: bf16
  adapter_precision: float32
  attention_implementation: sdpa

adapter:
  rank: 8
  lora_alpha: 16
  target_modules:
    - q_proj
    - v_proj
  adapted_modules: 64

optimization:
  optimizer: adamw
  learning_rate: 2.0e-4
  weight_decay: 0.01
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  scheduler: linear
  warmup_steps: 0
  epochs: 15
  per_device_batch_size: 4
  gradient_accumulation_steps: 2
  effective_batch_size: 8
  optimizer_steps: 240
  max_sequence_length: 512

learning_rate_allocation:
  scheme: uniform
  differential_B_learning_rate: false
  eigenvalue_learning_rates: false

initialization:
  activation_source: response_position
  pooling: >-
    mean over hidden states at positions t whose next token t+1 is supervised
  statistic: pca
  pca_solver: randomized
  pca_precision: float32
  pca_random_rotation: false
  basis_scale: 2.23606797749979         # sqrt(5)
  init_B: zeros

pivot:
  enabled: true
  epoch: 3
  global_step: 48
  decomposition: reduced QR in float64, stored back in float32
  optimizer_state_reset: [A, B]
  post_pivot_lr_override: false
  preservation_tolerance: 1.0e-5

data:
  dataset: ChilleD/SVAMP
  official_train_examples: 700
  official_test_examples: 300
  n_train: 128
  eval_examples: 300
  sampling: numpy.random.default_rng(seed).choice(700, 128, replace=False)
  manifests: manifests/svamp/     # includes the stable SVAMP IDs
  prompt_template: "Question: {Body} {Question}\nAnswer:"
  completion_template: "Equation: {Equation}\n#### {Answer}"
  field_normalization: >-
    Body and Question are whitespace-normalized and joined with one space;
    if Body is empty the prompt uses Question alone
  completion_masking: >-
    joint tokenization with character offsets; prompt tokens are set to -100;
    completion tokens and the appended EOS are supervised

generation:
  decoding: greedy
  batch_size: 1
  max_new_tokens: 512
  stop: EOS
  pad_token: EOS

evaluation:
  metric: numeric exact match on the Answer field
  parser: src/evaluation.py
  per_example_predictions: written by the script (not redistributed here)

seeds: [42, 43, 44]

hardware:
  gpu: NVIDIA GeForce RTX 5090 (31.8 GB)
  torch: 2.9.0+cu128
  cuda: "12.8"
